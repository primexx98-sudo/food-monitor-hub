name: 대시보드 동기화

on:
  schedule:
    # 2026-08-26: 하루 1회(09:47 KST)만 돌던 걸 2시간마다로 단축 — 소스 저장소
    # 푸시 후 실제 공개 URL 반영까지 체감 지연이 너무 커서(최대 하루 가까이) 발생한
    # "반영 안 됐는데?" 문제 완화. 47분에 맞춰 정각 트리거 큐잉 지연을 피함.
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: health-trend 결과물 복사
        run: |
          git clone --depth 1 https://github.com/primexx98-sudo/health-trend.git /tmp/health-trend
          rm -rf docs/trend
          mkdir -p docs/trend
          cp -r /tmp/health-trend/docs/. docs/trend/

      - name: FOODLAW-MONITORING 결과물 복사
        run: |
          git clone --depth 1 https://github.com/primexx98-sudo/FOODLAW-MONITORING.git /tmp/foodlaw
          rm -rf docs/law
          mkdir -p docs/law
          cp -r /tmp/foodlaw/docs/. docs/law/

      - name: 공용 네비게이션 바 삽입
        run: python scripts/inject_nav.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/trend docs/law
          git diff --cached --quiet || git commit -m "sync: 대시보드 동기화 $(date +'%Y-%m-%d')"
          git push
